stages:
  - scan-iac
  - validate

# --- DevSecOps: shift-left, before building anything ---
checkov-terraform:
  stage: scan-iac
  image: bridgecrew/checkov:latest
  script:
    - checkov -d terraform/ --compact --quiet
  allow_failure: false

trivy-fs-scan:
  stage: scan-iac
  image: aquasec/trivy:latest
  script:
    # Scans the whole repo: dependencies, secrets, IaC (K8s manifests and Terraform)
    - trivy fs --severity CRITICAL,HIGH --exit-code 1 .

gitleaks-scan:
  stage: scan-iac
  image: zricethezav/gitleaks:latest
  script:
    # Detects committed secrets (API keys, LiteLLM master keys, etc.)
    # before merging to main. Complements trivy fs (which also detects
    # secrets but with less focus on commit history).
    - gitleaks detect --source . --verbose --redact
  allow_failure: false

# --- Validation: there's no custom image to build here (this repo deploys
# third-party OSS images — vllm/vllm-openai, litellm — not application code),
# so there's no build/push/deploy stage. FluxCD watches the repo directly and
# reconciles whatever lands on main; CI only gates what's allowed to reach
# main. Same GitOps pattern you use at Bolt/CPM: never manual kubectl/deploy,
# everything goes through Git. ---
validate-k8s-manifests:
  stage: validate
  image: ghcr.io/yannh/kubeconform:latest-alpine
  script:
    # -ignore-missing-schemas: CRDs without a public schema (Prometheus
    # Operator's ServiceMonitor, KEDA's ScaledObject, Kyverno's ClusterPolicy)
    - kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.30.0 k8s/

validate-kyverno-policies:
  stage: validate
  # The official kyverno-cli image is distroless (no shell), which GitLab
  # needs to run `script`, so the pinned CLI binary is downloaded instead and
  # verified against the release checksum. Keep KYVERNO_VERSION in sync with
  # the Kyverno version running in the cluster.
  image: alpine:3.20
  variables:
    KYVERNO_VERSION: v1.19.1
    KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
  script:
    - apk add --no-cache curl
    - curl -sSLo kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
    - echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
    - tar -xzf kyverno.tar.gz kyverno
    # Runs the same admission policies the cluster enforces against the raw
    # manifests, so a violation fails here instead of at Flux reconcile time.
    # Exits non-zero on any failed rule. Helm-managed components (Qdrant,
    # kube-prometheus-stack) aren't covered: only their values files live here.
    - ./kyverno apply k8s/security/kyverno-policies/ --resource k8s/vllm/ --resource k8s/litellm/ --resource k8s/gpu/

validate-terraform:
  stage: validate
  image: hashicorp/terraform:1.7
  script:
    - terraform -chdir=terraform fmt -check -recursive
    - terraform -chdir=terraform init -backend=false
    - terraform -chdir=terraform validate
    - terraform -chdir=terraform/bootstrap init
    - terraform -chdir=terraform/bootstrap validate
