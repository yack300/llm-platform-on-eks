# ServiceMonitors (need Prometheus Operator CRDs) and the Grafana dashboard.
# Helm values files in that directory are consumed by kube-prometheus-stack,
# not applied as manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # Deleting this Application also deletes everything it deployed (PVCs
  # included), which is what teardown relies on (see scripts/teardown-eks.sh).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://github.com/yack300/llm-platform-on-eks.git
    targetRevision: main
    path: k8s/observability
    directory:
      include: "{servicemonitors.yaml,grafana-dashboard-llm-cost.yaml}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
