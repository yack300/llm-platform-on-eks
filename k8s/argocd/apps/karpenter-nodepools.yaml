# Karpenter's NodePools and EC2NodeClasses (k8s/karpenter/). Wave 1: needs
# the CRDs the karpenter Application installs in wave 0.
#
# The GPU EC2NodeClass's image cache (snapshotID/volumeInitializationRate)
# is set per account by scripts/set-gpu-image-cache.sh, not in Git: Argo CD
# ignores those two fields and keeps them on sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepools
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # Deleting this Application deletes the NodePools, and Karpenter then
  # terminates every node they launched; teardown relies on it (see
  # scripts/teardown-eks.sh).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/yack300/llm-platform-on-eks.git
    targetRevision: main
    path: k8s/karpenter
  ignoreDifferences:
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
      name: gpu
      jqPathExpressions:
        - .spec.blockDeviceMappings[]?.ebs.snapshotID
        - .spec.blockDeviceMappings[]?.ebs.volumeInitializationRate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
