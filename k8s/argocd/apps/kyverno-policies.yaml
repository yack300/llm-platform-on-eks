# Needs Kyverno's CRDs (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # Deleting this Application also deletes everything it deployed (PVCs
  # included), which is what teardown relies on (see scripts/teardown-eks.sh).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  source:
    repoURL: https://github.com/yack300/ll-platform-on-eks.git
    targetRevision: main
    path: k8s/security/kyverno-policies
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
