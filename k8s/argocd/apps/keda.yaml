# Event-driven autoscaling (vLLM scale-to-zero, k8s/vllm/keda-scaledobject.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  # Deleting this Application also deletes everything it deployed (PVCs
  # included), which is what teardown relies on (see scripts/teardown-eks.sh).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.0
    helm:
      releaseName: keda
      valuesObject:
        {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs too large for client-side apply annotations
