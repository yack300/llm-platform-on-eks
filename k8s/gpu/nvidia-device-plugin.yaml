# NVIDIA device plugin: exposes nvidia.com/gpu as a schedulable resource on
# the nodes of the GPU node group (created in
# terraform/modules/eks-gpu-nodegroup/). Synced by Argo CD, not by
# Terraform (Terraform = AWS infra, Argo CD = cluster workloads).
#
# Source: https://github.com/NVIDIA/k8s-device-plugin
# If more complete management is needed in the future (drivers, container
# toolkit, DCGM exporter), migrate to the NVIDIA GPU Operator (also via Argo CD).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      # The toleration only ALLOWS running on the tainted GPU nodes; the
      # affinity is what keeps the plugin off the platform nodes, where it
      # can't load the NVIDIA libraries and crash-loops (blocking Argo CD's
      # sync waves). The node group name is fixed in
      # terraform/modules/eks-gpu-nodegroup/main.tf (node_group_name).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values: ["gpu-inference"]
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
        - key: CriticalAddonsOnly
          operator: Exists
      priorityClassName: "system-node-critical"
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
