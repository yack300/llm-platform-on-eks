# Supply chain: only admit this repo's own images (ghcr.io/yack300/*) if CI
# signed them. Third-party images (vLLM, LiteLLM, Qdrant, ...) aren't matched:
# they aren't signed by this repo and would always fail.
#
# Keyless signing (Sigstore): CI runs `cosign sign` with the workflow's
# GitHub OIDC identity, and the signature lands in the public Rekor
# transparency log. There's no private key to store or leak; what's verified
# is *who* signed: the ci.yml workflow of this repository, on main. An image
# pushed from a laptop, a fork or another branch is rejected.
#
# mutateDigest rewrites the Pod's image to the verified digest, so the tag
# can't be repointed between verification and pull.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-signature
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30 # verification calls GHCR and Rekor
  rules:
    - name: verify-own-images-signed
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - llm-platform
      verifyImages:
        - imageReferences:
            - "ghcr.io/yack300/*"
          mutateDigest: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/yack300/llm-platform-on-eks/.github/workflows/ci.yml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
