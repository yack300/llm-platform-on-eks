# ONLY for kind (scripts/chargeback-local.sh), on top of opencost-values.yaml.
# kind has no cloud prices. CPU and memory cost nothing here and each fake
# GPU node's whole hourly price sits on its GPU (a node annotation the script
# sets), so a report can be checked by hand: hours x price.
opencost:
  customPricing:
    enabled: true
    costModel:
      description: g4dn.xlarge prices on the GPU only
      discount: "0%"
      CPU: 0
      spotCPU: 0
      RAM: 0
      spotRAM: 0
      GPU: 0
      storage: 0
      zoneNetworkEgress: 0
      regionNetworkEgress: 0
      internetNetworkEgress: 0
