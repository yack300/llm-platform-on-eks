# Overflow capacity for platform workloads, on top of the fixed platform
# managed node group (terraform/main.tf), which also runs Karpenter itself.
# Mostly for pods the scheduler can't place on those two nodes, including
# pods whose EBS volume sits in an AZ where no platform node is left after a
# spot interruption: Karpenter launches the node in the volume's AZ, which
# the Cluster Autoscaler couldn't do with one multi-AZ node group (Qdrant and
# Grafana stayed Pending on the second EKS run).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: platform
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: platform
      requirements:
        # Same 8 GiB types as the managed node group.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.large", "t3a.large", "m5.large", "m5a.large"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
  # Cost guard: at most two extra 2-vCPU nodes.
  limits:
    cpu: "4"
  disruption:
    # Repack and remove these nodes as soon as their pods fit elsewhere.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: platform
spec:
  amiSelectorTerms:
    - alias: bottlerocket@v1.66.0
  role: llm-platform-demo-karpenter-node # terraform: module.karpenter
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: llm-platform-demo
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: llm-platform-demo
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
