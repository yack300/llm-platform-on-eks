apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-gateway
  namespace: llm-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-gateway
  template:
    metadata:
      labels:
        app: litellm-gateway
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.99.1 # pinned: check github.com/BerriAI/litellm/releases for newer versions
          args: ["--config", "/config/config.yaml"]
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - secretRef:
                name: litellm-secrets  # LITELLM_MASTER_KEY, ANTHROPIC_API_KEY, etc.
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext: # required by kyverno-policies/disallow-privileged-containers.yaml
            allowPrivilegeEscalation: false
            privileged: false
          # Measured ~800Mi peak at idle/light load (v1.99.1); the previous
          # 512Mi limit got the container OOMKilled during startup. Startup is
          # single-threaded and CPU-bound (Python imports), so a 500m CPU limit
          # stretched it past 3 minutes.
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          # Without probes the pod reports Ready long before port 4000 is
          # listening. The server is busy right after it binds the port, hence
          # the longer timeouts.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60 # up to 5 minutes
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-gateway
  namespace: llm-platform
  labels:
    app: litellm-gateway # matched by the ServiceMonitor in k8s/observability/servicemonitors.yaml
spec:
  selector:
    app: litellm-gateway
  ports:
    - port: 4000
      targetPort: 4000
      name: "4000"
