# LiteLLM gateway config: exposes a single OpenAI-style API to your local
# vLLM and (optionally) to external providers.
#
# Docs: https://docs.litellm.ai/docs/proxy/configs
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm-platform
data:
  config.yaml: |
    model_list:
      - model_name: local-mistral
        litellm_params:
          # "local-mistral" matches --served-model-name in
          # k8s/vllm/deployment.yaml
          model: openai/local-mistral
          api_base: http://vllm-inference.llm-platform.svc.cluster.local:8000/v1
          api_key: "no-real-key-needed-locally"

      # External provider used as fallback while vLLM is scaled to 0 or
      # cold-starting (see k8s/vllm/keda-scaledobject.yaml), and as the
      # reference for the cost comparison. Optional: without ANTHROPIC_API_KEY
      # in the litellm-secrets Secret, LiteLLM still starts and serves
      # local-mistral, but requests fail instead of falling back while vLLM
      # is down. Clients keep asking for "local-mistral" either way.
      - model_name: claude-fallback
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY

    router_settings:
      # Automatic fallback if the local model doesn't respond
      fallbacks: [{"local-mistral": ["claude-fallback"]}]
      # No retries before falling back: with vLLM scaled to zero, two retries
      # of the refused connection took ~6.3 s of an 8.6 s fallback answer
      # (docs/tracing.md); without them it falls back in under a second.
      # The first attempt still reaches local-mistral, so KEDA's
      # gateway-demand trigger counts it and wakes vLLM. A transient vLLM
      # error now goes to claude-fallback instead of being retried.
      num_retries: 0

    litellm_settings:
      # This is what feeds the cost observability layer (Phase 4): exposes
      # native Prometheus metrics on /metrics:4000 (cost per token/request,
      # latency, success/failure per model). Scraped by the ServiceMonitor
      # in k8s/observability/servicemonitors.yaml.
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
      # Spans to Tempo, continuing the caller's traceparent (the RAG API
      # sends one), so a RAG request and its model call are one trace.
      # EKS only: kind runs no Tempo (configmap-local.yaml).
      callbacks: ["otel"]
      # Drop request parameters a model doesn't support instead of failing
      # the call: claude-sonnet-5 only accepts temperature=1, so any client
      # sending temperature=0 had its claude-fallback rejected too.
      drop_params: true
      # /metrics requires the master key by default; Prometheus scrapes it
      # without credentials rather than being handed the gateway admin key.
      # The endpoint is only reachable in-cluster (ClusterIP Service).
      require_auth_for_metrics_endpoint: false
      set_verbose: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
