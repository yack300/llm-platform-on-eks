# NOTE: this manifest assumes GPU mode. For local testing on kind/minikube
# without GPU, use the CPU variant (see deploy-local.sh), which runs slower
# but is enough to validate the gateway and RAG logic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: llm-platform
  labels:
    app: vllm-inference
spec:
  # No replicas field: KEDA (keda-scaledobject.yaml) owns the replica count,
  # including 0. A fixed value here would make Argo CD's self-heal undo every
  # scale-down.
  # Recreate, not RollingUpdate: each replica holds a whole GPU, so a rolling
  # update's surge pod stays Pending while the old pod keeps the only GPU, and
  # the rollout deadlocks (found on the first EKS run). Updates cost a short
  # gap, covered by LiteLLM's fallback.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      # Tolerates the GPU node group taint defined in Terraform
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0 # pinned: check hub.docker.com/r/vllm/vllm-openai/tags for newer releases
          args:
            # AWQ-quantized Mistral-7B-Instruct (~4GB): fits comfortably in
            # the 16GB T4 of a g4dn.xlarge along with the KV cache. AWQ has
            # better kernel support in vLLM for T4 (compute capability 7.5)
            # than GPTQ. max-model-len is capped to leave more VRAM for the
            # KV cache under concurrent load.
            - "--model"
            - "TheBloke/Mistral-7B-Instruct-v0.2-AWQ"
            # Short, stable name so LiteLLM doesn't depend on the HF path
            - "--served-model-name"
            - "local-mistral"
            - "--quantization"
            - "awq"
            - "--max-model-len"
            - "4096"
            - "--gpu-memory-utilization"
            - "0.85"
          ports:
            - containerPort: 8000
          securityContext: # required by kyverno-policies/disallow-privileged-containers.yaml
            allowPrivilegeEscalation: false
            privileged: false
          # Sized for the default g4dn.xlarge (4 vCPU, 16 GiB), leaving headroom
          # for system DaemonSets (aws-node, kube-proxy, nvidia-device-plugin).
          # CPU/memory limits are required by require-resource-limits.yaml.
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "3"
              memory: 12Gi
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 8Gi
          # A cold start downloads ~4 GB of weights from Hugging Face and loads
          # them into the GPU before /health answers, which takes minutes. With
          # only a liveness probe (90s delay) the kubelet killed vLLM mid-
          # download on the first EKS run. The startup probe gives it up to
          # 20 minutes; liveness/readiness only start once it has passed.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120 # 20 minutes
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: llm-platform
  labels:
    app: vllm-inference # matched by the ServiceMonitor in k8s/observability/servicemonitors.yaml
spec:
  selector:
    app: vllm-inference
  ports:
    - port: 8000
      targetPort: 8000
      name: "8000"
