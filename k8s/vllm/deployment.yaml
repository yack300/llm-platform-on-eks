# NOTE: this manifest assumes GPU mode. For local testing on kind/minikube
# without GPU, use the CPU variant (see deploy-local.sh), which runs slower
# but is enough to validate the gateway and RAG logic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: llm-platform
  labels:
    app: vllm-inference
    # The product team's GPU queue (Kueue, k8s/teams/queues.yaml): each
    # replica is admitted against the team's quota, taking back any share
    # research borrowed.
    kueue.x-k8s.io/queue-name: product
spec:
  # No replicas field: KEDA (keda-scaledobject.yaml) owns the replica count,
  # including 0. A fixed value here would make Argo CD's self-heal undo every
  # scale-down.
  # Recreate, not RollingUpdate: each replica holds a whole GPU, so a rolling
  # update's surge pod stays Pending while the old pod keeps the only GPU, and
  # the rollout deadlocks (found on the first EKS run). Updates cost a short
  # gap, covered by LiteLLM's fallback.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      # Bound by Pod Identity (terraform/main.tf) to read the LoRA adapters
      # from the artifacts bucket.
      serviceAccountName: vllm
      # Tolerates the GPU node group taint defined in Terraform
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      # LoRA adapters from the artifacts bucket (fine-tuning pipeline,
      # docs/fine-tuning.md), downloaded at every start: an adapter loaded at
      # runtime would be lost on each scale-to-zero. ADAPTERS is
      # "name=path name=path", paths under the bucket; each name must match a
      # --lora-modules entry below, a LiteLLM model and the RAG API's
      # ALLOWED_MODELS. The bucket's name is per account, so it comes from the
      # artifacts-bucket ConfigMap (scripts/bootstrap-argocd.sh). If the
      # download fails vLLM doesn't start: listed adapters are part of what
      # it serves.
      initContainers:
        - name: fetch-adapters
          image: amazon/aws-cli:2.42.1
          command: [sh, -ec]
          args:
            - |
              for a in $ADAPTERS; do
                name=${a%%=*}; path=${a#*=}
                aws s3 sync "s3://$BUCKET/$path" "/adapters/$name" --only-show-errors
                echo "$name: $(ls /adapters/$name | tr '\n' ' ')"
              done
          env:
            - name: ADAPTERS
              value: rag-behavior-v1=mlflow/2/4f4368e88c7b4f9d96556b16d704e7cd/artifacts/adapter
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: artifacts-bucket
                  key: bucket
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: adapters
              mountPath: /adapters
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0 # pinned: check hub.docker.com/r/vllm/vllm-openai/tags for newer releases
          args:
            # AWQ-quantized Mistral-7B-Instruct (~4GB): fits comfortably in
            # the 16GB T4 of a g4dn.xlarge along with the KV cache. AWQ has
            # better kernel support in vLLM for T4 (compute capability 7.5)
            # than GPTQ. max-model-len is capped to leave more VRAM for the
            # KV cache under concurrent load.
            - "--model"
            - "TheBloke/Mistral-7B-Instruct-v0.2-AWQ"
            # Short, stable name so LiteLLM doesn't depend on the HF path
            - "--served-model-name"
            - "local-mistral"
            - "--quantization"
            - "awq"
            - "--max-model-len"
            - "4096"
            - "--gpu-memory-utilization"
            - "0.85"
            # LoRA adapters on top of the AWQ base (vLLM tests LoRA on AWQ
            # models), each served as its own model name next to
            # local-mistral, so base and adapters answer side by side on one
            # GPU. Rank 16: the fine-tuning default.
            - "--enable-lora"
            - "--max-lora-rank"
            - "16"
            - "--max-loras"
            - "2"
            - "--lora-modules"
            - "rag-behavior-v1=/adapters/rag-behavior-v1"
          ports:
            - containerPort: 8000
          securityContext: # required by kyverno-policies/disallow-privileged-containers.yaml
            allowPrivilegeEscalation: false
            privileged: false
          # Sized for the default g4dn.xlarge (4 vCPU, 16 GiB), leaving headroom
          # for system DaemonSets (aws-node, kube-proxy, eks-pod-identity-agent).
          # CPU/memory limits are required by require-resource-limits.yaml.
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "3"
              memory: 12Gi
            requests:
              nvidia.com/gpu: 1
              cpu: "2"
              memory: 8Gi
          # A cold start downloads ~4 GB of weights from Hugging Face and loads
          # them into the GPU before /health answers, which takes minutes. With
          # only a liveness probe (90s delay) the kubelet killed vLLM mid-
          # download on the first EKS run. The startup probe gives it up to
          # 20 minutes; liveness/readiness only start once it has passed.
          volumeMounts:
            - name: adapters
              mountPath: /adapters
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120 # 20 minutes
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: adapters
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: llm-platform
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: llm-platform
  labels:
    app: vllm-inference # matched by the ServiceMonitor in k8s/observability/servicemonitors.yaml
spec:
  selector:
    app: vllm-inference
  ports:
    - port: 8000
      targetPort: 8000
      name: "8000"
