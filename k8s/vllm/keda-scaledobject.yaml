# Requires KEDA installed in the cluster: https://keda.sh/docs/latest/deploy/
#
# Scales on request demand instead of CPU, which is the right signal for
# inference workloads (the real bottleneck is the GPU, not the pod's CPU).
#
# Two triggers, because one metric can't cover both directions:
#   - gateway-demand wakes vLLM from 0. It reads LiteLLM, which is always
#     running; a vLLM metric can't do this, since at 0 replicas nothing
#     publishes it.
#   - vllm-queue drives scale-out from 1 to maxReplicaCount once vLLM is up.
# KEDA scales to 0 when both are inactive for cooldownPeriod. While vLLM is
# cold-starting, LiteLLM serves requests through its fallback (see
# router_settings.fallbacks in k8s/litellm/configmap.yaml).
#
# Waking from 0 also needs a GPU node: the GPU node group starts at 0, so the
# Cluster Autoscaler adds one when the vLLM pod is Pending (see the
# node-template ASG tags in terraform/modules/eks-gpu-nodegroup).
#
# k8s/vllm/keda-scaledobject-local.yaml mirrors these triggers against the
# local Ollama mock; keep both in sync.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-inference-scaler
  namespace: llm-platform
spec:
  scaleTargetRef:
    name: vllm-inference
  minReplicaCount: 0  # allows scaling to 0 when there's no traffic (real cost savings)
  maxReplicaCount: 3
  cooldownPeriod: 120
  triggers:
    # Prometheus installed via kube-prometheus-stack with release name
    # "prometheus" (see k8s/observability/prometheus-grafana-values.yaml).
    - type: prometheus
      name: gateway-demand
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # Every attempt LiteLLM routes to local-mistral in the last 5 minutes,
        # including the ones that fail because vLLM is at 0 (the proxy-level
        # litellm_proxy_total_requests_metric doesn't count those).
        # LiteLLM only creates this counter series on its first request,
        # already at 1, and increase() of a series with no earlier sample is
        # 0, so a plain increase() never sees the first request after LiteLLM
        # starts (found on the first EKS run). Series older than the window use
        # increase(); brand-new ones count with their current value.
        query: >-
          sum(
            (increase(litellm_deployment_total_requests_total{requested_model="local-mistral"}[5m])
              and litellm_deployment_total_requests_total{requested_model="local-mistral"} offset 5m)
            or litellm_deployment_total_requests_total{requested_model="local-mistral"}
          ) or vector(0)
        activationThreshold: "0"  # any request activates (wakes from 0)
        # Scale-out is left to vllm-queue: ~2 req/s per replica is higher than
        # this trigger should ever need to push on its own.
        threshold: "600"
    - type: prometheus
      name: vllm-queue
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # Native vLLM metric (colon-separated name), scraped by the
        # vllm-inference ServiceMonitor in k8s/observability/servicemonitors.yaml.
        query: sum(vllm:num_requests_waiting) or vector(0)
        threshold: "5"
