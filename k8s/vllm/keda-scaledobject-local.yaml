# ONLY for local development on kind/minikube (applied by
# scripts/deploy-local.sh), NEVER on real EKS. Same triggers as
# keda-scaledobject.yaml, pointed at the Ollama mock instead of vLLM, so
# scale-to-zero and wake-from-zero can be tested without a GPU. The
# vllm-queue trigger always reads 0 locally (no vLLM running) and is kept
# only so both files stay comparable; keep them in sync.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: local-llm-mock-scaler
  namespace: llm-platform
spec:
  scaleTargetRef:
    name: local-llm-mock
  minReplicaCount: 0
  maxReplicaCount: 1  # CPU mock: more replicas only cost laptop memory
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      name: gateway-demand
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # LiteLLM only creates this counter series on its first request,
        # already at 1, and increase() of a series with no earlier sample is
        # 0, so a plain increase() never sees the first request after LiteLLM
        # starts (found on the first EKS run). Series older than the window use
        # increase(); brand-new ones count with their current value.
        query: >-
          sum(
            (increase(litellm_deployment_total_requests_total{requested_model="local-mistral"}[5m])
              and litellm_deployment_total_requests_total{requested_model="local-mistral"} offset 5m)
            or litellm_deployment_total_requests_total{requested_model="local-mistral"}
          ) or vector(0)
        activationThreshold: "0"
        threshold: "600"
    - type: prometheus
      name: vllm-queue
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: sum(vllm:num_requests_waiting) or vector(0)
        threshold: "5"
