# Deployed via the official Helm chart:
#   helm repo add qdrant https://qdrant.github.io/qdrant-helm
#   helm install qdrant qdrant/qdrant -n llm-platform -f helm-values.yaml
#
# Alternative: Weaviate (helm.weaviate.io) if you prefer its schema/class
# model over plain collections.

replicaCount: 1

persistence:
  enabled: true
  size: 4Gi   # enough for a small test corpus

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

service:
  type: ClusterIP
  port: 6333

# Filled by the RAG ingestion Job (k8s/rag/ingest-job.yaml, code in
# apps/rag/): the project's docs, chunked and embedded, into a versioned
# collection behind the `platform-docs` alias; the RAG API (k8s/rag/api.yaml)
# queries it and answers through LiteLLM.
