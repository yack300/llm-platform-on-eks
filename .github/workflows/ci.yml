# Gates what's allowed to reach main, which Argo CD then syncs (GitOps: no
# manual kubectl/deploy, everything goes through Git). Scans run first; then
# manifest/Terraform validation and the RAG image (apps/rag/), the only image
# built here: everything else is third-party (vLLM, LiteLLM, Qdrant, Ollama).
# On main, the RAG image is pushed to GHCR and signed keylessly; the cluster
# only admits it with that signature (require-image-signature.yaml).
#
# Every tool runs from a version-pinned container image, so the same commands
# work locally with `docker run` (see CLAUDE.md). Bump versions deliberately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.20
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0
  # Community JSON schemas for CRDs (Argo CD Application, KEDA ScaledObject,
  # ServiceMonitor, Kyverno ClusterPolicy), pinned to a commit.
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/4c8dc296d32b06d15ccde9668ff136c951f4d539/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
  # Keep in sync with the Kyverno version running in the cluster.
  KYVERNO_IMAGE: ghcr.io/kyverno/kyverno-cli:v1.19.1
  TERRAFORM_IMAGE: hashicorp/terraform:1.16.4
  # Same base as apps/rag/Dockerfile, for the unit tests.
  PYTHON_IMAGE: python:3.12.15-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  # v2, not v3: cosign v3 writes signatures only as OCI referrers in the new
  # bundle format, which Kyverno's verifyImages doesn't read and GHCR can't
  # serve (no referrers API). v2 writes the classic .sig tag.
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v2.6.5
  RAG_IMAGE: ghcr.io/yack300/llm-platform-rag

jobs:
  # --- DevSecOps: shift-left scans ---
  checkov:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberate skips are documented inline as #checkov:skip comments.
      - run: docker run --rm -v "$PWD":/repo -w /repo "$CHECKOV_IMAGE" -d terraform/ --compact --quiet

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Default fs scanners: dependency vulnerabilities and secrets. IaC
      # misconfigurations are covered by Checkov (Terraform) and Kyverno (K8s).
      - run: docker run --rm -v "$PWD":/repo -w /repo "$TRIVY_IMAGE" fs --severity CRITICAL,HIGH --exit-code 1 .

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      # Detects committed secrets (API keys, LiteLLM master keys, etc.).
      - run: docker run --rm -v "$PWD":/repo "$GITLEAKS_IMAGE" git /repo --redact --verbose

  # --- Validation (runs only if the scans pass) ---
  kubeconform:
    needs: [checkov, trivy-fs, gitleaks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CRD resources are validated against CRD_SCHEMAS; no
      # -ignore-missing-schemas, so a CRD kind without a schema fails instead
      # of being silently skipped. -ignore-filename-pattern: Helm values files
      # live under k8s/ but aren't Kubernetes manifests.
      - run: >-
          docker run --rm -v "$PWD":/repo -w /repo "$KUBECONFORM_IMAGE"
          -summary -strict
          -schema-location default -schema-location "$CRD_SCHEMAS"
          -ignore-filename-pattern 'values(-local)?\.yaml$'
          -kubernetes-version 1.36.0 k8s/

  kyverno:
    needs: [checkov, trivy-fs, gitleaks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs the same admission policies the cluster enforces against the raw
      # manifests, so a violation fails here instead of at Argo CD sync time.
      # Helm-managed components (Qdrant, kube-prometheus-stack) aren't covered:
      # only their values files live here.
      - name: Admission policies against every workload manifest
        # Explicit bash gets -o pipefail, so `| tee` can't hide a failure.
        shell: bash
        run: |
          # One -r per file. Given a directory, kyverno apply ignores every
          # other --resource; and two manifests with the same name (the
          # EKS/local LiteLLM ConfigMap pair) make it panic yet exit 0. Both
          # kept LiteLLM's Deployment out of this check until the RAG work.
          args=()
          for f in k8s/vllm/*.yaml k8s/litellm/*.yaml k8s/rag/*.yaml; do
            grep -qE '^kind: (Deployment|Job|StatefulSet|DaemonSet)$' "$f" && args+=(-r "$f")
          done
          # require-image-signature needs the image already pushed and signed:
          # it's enforced at admission time instead (signed below on main).
          policies=()
          for f in k8s/security/kyverno-policies/*.yaml; do
            [[ $f == *require-image-signature* ]] || policies+=("$f")
          done
          docker run --rm -v "$PWD":/repo -w /repo "$KYVERNO_IMAGE" \
            apply "${policies[@]}" "${args[@]}" 2>&1 | tee kyverno.out
          ! grep -q panic kyverno.out

  terraform:
    needs: [checkov, trivy-fs, gitleaks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fmt and validate (main module and bootstrap)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint sh "$TERRAFORM_IMAGE" -ec '
            terraform -chdir=terraform fmt -check -recursive
            terraform -chdir=terraform init -backend=false -input=false
            terraform -chdir=terraform validate
            terraform -chdir=terraform/bootstrap init -input=false
            terraform -chdir=terraform/bootstrap validate
          '

  # --- RAG image: test, build, scan; push + sign on main only ---
  rag-image:
    needs: [checkov, trivy-fs, gitleaks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # GitHub OIDC token for keyless signing (main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        run: >-
          docker run --rm -v "$PWD/apps/rag":/app -w /app "$PYTHON_IMAGE"
          sh -c 'pip install -q --root-user-action=ignore -r requirements-dev.txt && python -m pytest -q tests'

      - name: Manifests use apps/rag/VERSION
        run: |
          version=$(cat apps/rag/VERSION)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if grep -h "image: $RAG_IMAGE:" k8s/rag/*.yaml | grep -v ":$version\$"; then
            echo "::error::k8s/rag/ references a tag other than $version"; exit 1
          fi

      - name: Build
        run: docker build -f apps/rag/Dockerfile -t "$RAG_IMAGE:$VERSION" .

      # Retrieval quality of the image about to ship (its model, chunking and
      # docs), against apps/rag/eval/: in-memory Qdrant, no model calls, so
      # deterministic and free. Fails below eval/baseline.json.
      - name: Retrieval evaluation
        shell: bash
        run: |
          # The table goes to the log and the job summary; pipefail (bash on
          # Actions) keeps the evaluator's exit code through tee.
          status=0
          {
            echo '### Retrieval evaluation'
            echo '```'
            docker run --rm -v "$PWD/apps/rag/eval":/eval:ro "$RAG_IMAGE:$VERSION" \
              python -m rag.evaluate --questions /eval/questions.yaml --baseline /eval/baseline.json 2>&1 \
              | tee /dev/stderr || status=$?
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Image vulnerabilities (OS packages and Python dependencies).
      - name: Scan the image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$RAG_IMAGE:$VERSION"

      # Tags are immutable: a published version is never overwritten. To
      # release a change, bump apps/rag/VERSION and the tags in k8s/rag/.
      - name: Push and sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$RAG_IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$RAG_IMAGE:$VERSION is already published; bump apps/rag/VERSION to release changes."
            exit 0
          fi
          docker push "$RAG_IMAGE:$VERSION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$RAG_IMAGE:$VERSION")
          # Keyless: cosign trades the workflow's OIDC token for a short-lived
          # certificate from Fulcio, signs the digest and records it in Rekor.
          # The identity Kyverno checks is this workflow file on main.
          # Runner's uid so it can read the owner-only docker login file.
          docker run --rm --user "$(id -u)" -e HOME=/tmp \
            -v "$HOME/.docker":/docker -e DOCKER_CONFIG=/docker \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            "$COSIGN_IMAGE" sign --yes "$digest"
          echo "::notice::Published and signed $digest"
